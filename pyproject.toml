[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-beast"
version = "0.1.0"
description = "Evidence-grounded internship discovery, ranking, tailoring, and application queue"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "rapidfuzz>=3.9",
  "rich>=13.7",
]

[project.optional-dependencies]
jobspy = ["python-jobspy>=1.1.0"]
apply = ["playwright>=1.45"]
agent = ["browser-use>=0.11"]
dev = ["pytest>=8"]

[project.scripts]
jobbeast = "jobbeast.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
